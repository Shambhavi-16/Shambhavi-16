
name: Generate GitHub Contribution Snake

on:
  schedule:
    - cron: "17 0 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    name: Generate Snake Animation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Generate light and dark snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Shambhavi-16
          outputs: |
            dist/github-contribution-grid-snake.svg?palette=github-light&color_snake=%2300D9FF&color_dots=%23ebedf0,%23c4b5fd,%239d8bfa,%236d5dfc,%234f46e5
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=%2300D9FF&color_dots=%2316162a,%233b3270,%235b4db1,%238b7cf6,%23c4b5fd

      - name: Publish generated SVGs to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
